<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - Tank Battle</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
}
#gameContainer {
  position: relative;
}
canvas {
  border: 3px solid #e94560;
  border-radius: 8px;
  display: block;
}
#startScreen, #gameOverScreen, #winScreen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.85);
  color: white;
  z-index: 10;
  border-radius: 8px;
}
#startScreen h1, #winScreen h1 {
  font-size: 48px;
  color: #e94560;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #e94560;
}
#gameOverScreen h1 {
  font-size: 48px;
  color: #ff6b6b;
  margin-bottom: 20px;
  text-shadow: 0 0 20px #ff6b6b;
}
.btn {
  padding: 15px 40px;
  font-size: 22px;
  background: #e94560;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.3s;
}
.btn:hover {
  background: #c81e45;
  transform: scale(1.05);
}
.instructions {
  color: #aaa;
  margin-top: 30px;
  text-align: center;
  line-height: 1.8;
  font-size: 16px;
}
#hud {
  position: absolute;
  top: 10px; left: 10px; right: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 5;
  pointer-events: none;
}
.hud-item {
  color: white;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 0 10px rgba(0,0,0,0.8);
}
#bossBar {
  position: absolute;
  bottom: 15px; left: 50%;
  transform: translateX(-50%);
  width: 60%;
  z-index: 5;
  pointer-events: none;
  display: none;
}
#bossBarLabel {
  color: #ff6b6b;
  font-size: 16px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 4px;
  text-shadow: 0 0 10px rgba(0,0,0,0.8);
}
#bossBarOuter {
  width: 100%;
  height: 20px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid #ff6b6b;
}
#bossBarInner {
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #ff6b6b, #e94560);
  border-radius: 10px;
  transition: width 0.3s;
}
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="600"></canvas>
  
  <div id="hud">
    <div class="hud-item" id="scoreDisplay">分数: 0</div>
    <div class="hud-item" id="waveDisplay">第1关</div>
    <div class="hud-item" id="hpDisplay">❤️❤️❤️❤️❤️❤️❤️❤️</div>
    <div class="hud-item" id="baseDisplay">🏠🏠🏠🏠🏠</div>
    <div class="hud-item" id="buffDisplay" style="font-size:14px;color:#ffd700;"></div>
  </div>
  
  <div id="bossBar">
    <div id="bossBarLabel">👾 BOSS</div>
    <div id="bossBarOuter"><div id="bossBarInner"></div></div>
  </div>
  
  <div id="startScreen">
    <h1>🎮 坦克大战</h1>
    <p style="color:#ccc; font-size:20px;">消灭敌人，击败Boss！</p>
    <button class="btn" onclick="startGame()">开始游戏</button>
    <div class="instructions">
      WASD / 方向键 - 移动<br>
      IJKL - 控制炮管方向<br>
      鼠标瞄准 / 空格键 - 射击<br>
      🧱 砖墙可以打碎 | 🛡️ 钢墙不可摧毁<br>
      💎 消灭敌人掉落道具，走过去拾取！<br>
      ❤️回血 ⚡加速 🔥火力 🛡️护盾 ⭐散弹<br>
      🏠 保护好你的基地！基地被毁=游戏结束！
      共20关，每5关一个Boss！加油！
    </div>
  </div>
  
  <div id="gameOverScreen" style="display:none;">
    <h1>💀 游戏结束</h1>
    <p style="color:#ccc; font-size:24px;" id="finalScore">最终分数: 0</p>
    <button class="btn" onclick="startGame()">再来一次</button>
  </div>
  
  <div id="winScreen" style="display:none;">
    <h1>🎉 胜利！</h1>
    <p style="color:#ccc; font-size:24px;" id="winScore">最终分数: 0</p>
    <button class="btn" onclick="startGame()">再玩一次</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let game = null;
let animId = null;

const keys = {};
let mouseX = 0, mouseY = 0;
let mouseDown = false;
let shootCooldown = 0;

document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
canvas.addEventListener('mousedown', e => { mouseDown = true; });
canvas.addEventListener('mouseup', e => { mouseDown = false; });

// ===== OBSTACLE SYSTEM =====
const BRICK_SIZE = 30; // each brick block size
const STEEL_SIZE = 40;

class Obstacle {
  constructor(x, y, type) {
    this.x = x; // center x
    this.y = y; // center y
    this.type = type; // 'brick' or 'steel'
    this.w = type === 'brick' ? BRICK_SIZE : STEEL_SIZE;
    this.h = type === 'brick' ? BRICK_SIZE : STEEL_SIZE;
    this.alive = true;
    this.hp = type === 'brick' ? 2 : 999; // brick takes 2 hits, steel indestructible
    this.maxHp = this.hp;
    this.flash = 0;
    // Random brick pattern seed
    this.pattern = Math.floor(Math.random() * 4);
  }
  
  draw() {
    if (!this.alive) return;
    ctx.save();
    
    if (this.type === 'brick') {
      // Brick wall - brownish with brick pattern
      let dmgRatio = this.hp / this.maxHp;
      let baseColor = this.flash > 0 ? '#fff' : '#b5651d';
      ctx.fillStyle = baseColor;
      ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      
      // Brick lines
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 1;
      // Horizontal line
      ctx.beginPath();
      ctx.moveTo(this.x - this.w/2, this.y);
      ctx.lineTo(this.x + this.w/2, this.y);
      ctx.stroke();
      // Vertical lines (staggered like real bricks)
      if (this.pattern % 2 === 0) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.h/2);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x - this.w/4, this.y);
        ctx.lineTo(this.x - this.w/4, this.y + this.h/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x + this.w/4, this.y);
        ctx.lineTo(this.x + this.w/4, this.y + this.h/2);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y + this.h/2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x - this.w/4, this.y - this.h/2);
        ctx.lineTo(this.x - this.w/4, this.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x + this.w/4, this.y - this.h/2);
        ctx.lineTo(this.x + this.w/4, this.y);
        ctx.stroke();
      }
      
      // Damage cracks
      if (this.hp < this.maxHp) {
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x - 5, this.y - 3);
        ctx.lineTo(this.x + 2, this.y + 1);
        ctx.lineTo(this.x + 7, this.y - 5);
        ctx.stroke();
      }
      
      // Border
      ctx.strokeStyle = '#a0522d';
      ctx.lineWidth = 1;
      ctx.strokeRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      
    } else {
      // Steel wall - metallic look
      let baseColor = this.flash > 0 ? '#fff' : '#708090';
      ctx.fillStyle = baseColor;
      ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      
      // Metallic shine
      let grad = ctx.createLinearGradient(this.x - this.w/2, this.y - this.h/2, this.x + this.w/2, this.y + this.h/2);
      grad.addColorStop(0, 'rgba(255,255,255,0.2)');
      grad.addColorStop(0.5, 'rgba(255,255,255,0)');
      grad.addColorStop(1, 'rgba(255,255,255,0.1)');
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
      
      // Rivets (4 corners)
      ctx.fillStyle = '#556';
      let rv = 3;
      let ox = this.w/2 - 6, oy = this.h/2 - 6;
      ctx.beginPath(); ctx.arc(this.x - ox, this.y - oy, rv, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(this.x + ox, this.y - oy, rv, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(this.x - ox, this.y + oy, rv, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(this.x + ox, this.y + oy, rv, 0, Math.PI*2); ctx.fill();
      
      // Border
      ctx.strokeStyle = '#556';
      ctx.lineWidth = 2;
      ctx.strokeRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
    }
    
    if (this.flash > 0) this.flash--;
    ctx.restore();
  }
}

function generateObstacles(wave) {
  let obstacles = [];
  const W = canvas.width, H = canvas.height;
  const playerSafeZone = { x: 450, y: 460, r: 100 };
  
  // Helper: check if position overlaps with existing obstacles or player spawn
  function overlaps(ox, oy, ow, oh) {
    // Check player safe zone
    if (Math.hypot(ox - playerSafeZone.x, oy - playerSafeZone.y) < playerSafeZone.r) return true;
    // Check existing obstacles
    for (let ob of obstacles) {
      if (Math.abs(ox - ob.x) < (ow + ob.w) / 2 + 5 && Math.abs(oy - ob.y) < (oh + ob.h) / 2 + 5) return true;
    }
    return false;
  }
  
  // Wave 1: Simple scattered bricks
  if (wave >= 1) {
    let brickCount = 8 + wave * 3;
    for (let i = 0; i < brickCount; i++) {
      let bx, ny, attempts = 0;
      do {
        bx = BRICK_SIZE + Math.random() * (W - BRICK_SIZE * 2);
        ny = BRICK_SIZE + Math.random() * (H - BRICK_SIZE * 2);
        attempts++;
      } while (overlaps(bx, ny, BRICK_SIZE, BRICK_SIZE) && attempts < 50);
      if (attempts < 50) obstacles.push(new Obstacle(bx, ny, 'brick'));
    }
  }
  
  // Wave 2+: Add steel walls
  if (wave >= 2) {
    let steelCount = wave;
    for (let i = 0; i < steelCount; i++) {
      let sx, sy, attempts = 0;
      do {
        sx = STEEL_SIZE + Math.random() * (W - STEEL_SIZE * 2);
        sy = STEEL_SIZE + Math.random() * (H - STEEL_SIZE * 2);
        attempts++;
      } while (overlaps(sx, sy, STEEL_SIZE, STEEL_SIZE) && attempts < 50);
      if (attempts < 50) obstacles.push(new Obstacle(sx, sy, 'steel'));
    }
  }
  
  // Wave 3+: Add brick wall clusters (L-shapes, lines)
  if (wave >= 3) {
    let clusterCount = 2;
    for (let c = 0; c < clusterCount; c++) {
      let cx = 100 + Math.random() * (W - 200);
      let cy = 100 + Math.random() * (H - 300);
      let shape = Math.floor(Math.random() * 3);
      let positions = [];
      
      if (shape === 0) {
        // L-shape
        positions = [
          [0, 0], [0, BRICK_SIZE], [0, BRICK_SIZE*2],
          [BRICK_SIZE, BRICK_SIZE*2]
        ];
      } else if (shape === 1) {
        // Horizontal line
        positions = [
          [-BRICK_SIZE, 0], [0, 0], [BRICK_SIZE, 0]
        ];
      } else {
        // T-shape
        positions = [
          [-BRICK_SIZE, 0], [0, 0], [BRICK_SIZE, 0],
          [0, BRICK_SIZE]
        ];
      }
      
      for (let [px, py] of positions) {
        let bx = cx + px, ny = cy + py;
        if (!overlaps(bx, ny, BRICK_SIZE, BRICK_SIZE) && bx > BRICK_SIZE && bx < W - BRICK_SIZE && ny > BRICK_SIZE && ny < H - BRICK_SIZE) {
          obstacles.push(new Obstacle(bx, ny, 'brick'));
        }
      }
    }
  }
  
  return obstacles;
}

// Check if a rectangle collides with any obstacle (for tank movement)
function collideObstacles(cx, cy, hw, hh) {
  for (let ob of game.obstacles) {
    if (!ob.alive) continue;
    if (Math.abs(cx - ob.x) < hw + ob.w/2 && Math.abs(cy - ob.y) < hh + ob.h/2) {
      return true;
    }
  }
  return false;
}

// Check if a point hits any obstacle
function pointHitObstacle(bx, by, bulletR, isPlayerBullet) {
  for (let ob of game.obstacles) {
    if (!ob.alive) continue;
    if (Math.abs(bx - ob.x) < ob.w/2 + bulletR && Math.abs(by - ob.y) < ob.h/2 + bulletR) {
      if (ob.type === 'brick') {
        ob.hp--;
        ob.flash = 5;
        if (ob.hp <= 0) {
          ob.alive = false;
          spawnExplosion(ob.x, ob.y, '#b5651d', 10);
          if (isPlayerBullet) game.score += 5;
        } else {
          spawnExplosion(bx, by, '#cd853f', 3);
        }
        return 'hit';
      } else {
        // Steel - bullet destroyed, spawn spark
        ob.flash = 3;
        spawnExplosion(bx, by, '#c0c0c0', 5);
        return 'hit';
      }
    }
  }
  return 'miss';
}

// Check bullet vs obstacles with sub-step raycast (prevents tunneling through thin walls)
function bulletHitObstacles(bx, by, prevX, prevY, bulletR, isPlayerBullet) {
  let dx = bx - prevX;
  let dy = by - prevY;
  let dist = Math.sqrt(dx*dx + dy*dy);
  let steps = Math.max(1, Math.ceil(dist / 4)); // check every 4px along the path
  
  for (let i = 0; i <= steps; i++) {
    let t = i / steps;
    let cx = prevX + dx * t;
    let cy = prevY + dy * t;
    let result = pointHitObstacle(cx, cy, bulletR, isPlayerBullet);
    if (result === 'hit') return 'hit';
  }
  return 'miss';
}

// ===== TANK =====
class Tank {
  constructor(x, y, color, isPlayer) {
    this.x = x;
    this.y = y;
    this.w = 40;
    this.h = 30;
    this.color = color;
    this.isPlayer = isPlayer;
    this.angle = 0;
    this.turretAngle = 0;
    this.speed = isPlayer ? 4 : 1.2;
    this.hp = isPlayer ? 8 : 2;
    this.invincible = isPlayer ? 120 : 0;
    this.maxHp = this.hp;
    this.shootTimer = 0;
    this.bullets = [];
    this.alive = true;
    this.flash = 0;
  }
  
  draw() {
    if (!this.alive) return;
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    
    let bodyColor = this.flash > 0 ? '#fff' : this.color;
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
    
    ctx.fillStyle = '#555';
    ctx.fillRect(-this.w/2 - 2, -this.h/2 - 4, this.w + 4, 6);
    ctx.fillRect(-this.w/2 - 2, this.h/2 - 2, this.w + 4, 6);
    
    ctx.rotate(this.turretAngle);
    ctx.fillStyle = this.isPlayer ? '#4ecdc4' : '#ff6b6b';
    ctx.fillRect(-5, -4, 30, 8);
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fillStyle = this.isPlayer ? '#45b7aa' : '#e94560';
    ctx.fill();
    
    ctx.restore();
    
    if (this.flash > 0) this.flash--;
  }
  
  update() {
    if (!this.alive) return;
    if (this.shootTimer > 0) this.shootTimer--;
    if (this.invincible > 0) this.invincible--;
  }
}

class Enemy extends Tank {
  constructor(x, y, type) {
    super(x, y, '#e94560', false);
    this.type = type;
    if (type === 'boss') {
      this.w = 70;
      this.h = 50;
      this.hp = 50;
      this.maxHp = 50;
      this.speed = 1;
      this.color = '#8b0000';
    }
    this.moveAngle = Math.random() * Math.PI * 2;
    this.moveTimer = 0;
    this.targetX = 0;
    this.targetY = 0;
  }
  
  update(player, W, H) {
    super.update();
    if (!this.alive) return;
    
    if (this.type === 'boss') {
      this.moveTimer++;
      let cx = W / 2, cy = H / 2;
      let radius = 180;
      let a = this.moveTimer * 0.01;
      this.targetX = cx + Math.cos(a) * radius;
      this.targetY = cy + Math.sin(a) * radius;
      
      let dx = this.targetX - this.x;
      let dy = this.targetY - this.y;
      let dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) {
        let spd = this.speed;
        if (hasEnemyBuff(this, 'speed')) spd *= 1.5;
        let nx = this.x + (dx/dist) * spd;
        let ny = this.y + (dy/dist) * spd;
        // Boss ignores obstacles (it's big and powerful)
        this.x = nx;
        this.y = ny;
      }
      
      this.turretAngle = Math.atan2(player.y - this.y, player.x - this.x);
      
      if (this.shootTimer <= 0) {
        this.shoot(player);
        this.shootTimer = 20;
      }
    } else {
      this.moveTimer++;
      if (this.moveTimer > 90) {
        this.moveAngle = Math.random() * Math.PI * 2;
        this.moveTimer = 0;
      }
      
      let spd = this.speed;
      if (hasEnemyBuff(this, 'speed')) spd *= 1.5;
      let nx = this.x + Math.cos(this.moveAngle) * spd;
      let ny = this.y + Math.sin(this.moveAngle) * spd;
      // Bounce off walls
      if (nx < 30 || nx > W - 30) this.moveAngle = Math.PI - this.moveAngle;
      if (ny < 30 || ny > H - 30) this.moveAngle = -this.moveAngle;
      nx = Math.max(30, Math.min(W - 30, nx));
      ny = Math.max(30, Math.min(H - 30, ny));
      
      // Bounce off obstacles
      if (collideObstacles(nx, ny, this.w/2, this.h/2)) {
        this.moveAngle = Math.PI - this.moveAngle + (Math.random() - 0.5) * 1.0;
        this.moveTimer = 80; // will change direction soon
      } else {
        this.x = nx;
        this.y = ny;
      }
      
      this.turretAngle = Math.atan2(player.y - this.y, player.x - this.x);
      
      if (this.shootTimer <= 0) {
        this.shoot(player);
        this.shootTimer = 90 + Math.random() * 60;
      }
    }
  }
  
  shoot(player) {
    let a = Math.atan2(player.y - this.y, player.x - this.x);
    let speed = this.type === 'boss' ? 3.5 : 2.5;
    let dmg = this.type === 'boss' ? 2 : 1;
    if (hasEnemyBuff(this, 'fire')) dmg *= 2;
    let bulletColor = hasEnemyBuff(this, 'fire') ? '#ff8800' : '#ff4444';
    let bulletR = this.type === 'boss' ? 6 : 3;
    
    // ALL enemies shoot 3 bullets (fan spread)
    let spreadAngle = this.type === 'boss' ? 0.25 : 0.2;
    for (let offset of [-spreadAngle, 0, spreadAngle]) {
      let sa = a + offset;
      game.enemyBullets.push({
        x: this.x + Math.cos(this.turretAngle) * 30,
        y: this.y + Math.sin(this.turretAngle) * 30,
        vx: Math.cos(sa) * speed,
        vy: Math.sin(sa) * speed,
        r: bulletR, dmg: dmg, color: bulletColor, alive: true
      });
    }
    
    // Boss extra wide spread at higher waves
    if (this.type === 'boss' && game.wave >= 3) {
      for (let offset of [-0.45, 0.45]) {
        let sa = a + offset;
        game.enemyBullets.push({
          x: this.x + Math.cos(this.turretAngle) * 30,
          y: this.y + Math.sin(this.turretAngle) * 30,
          vx: Math.cos(sa) * speed,
          vy: Math.sin(sa) * speed,
          r: bulletR, dmg: dmg, color: bulletColor, alive: true
        });
      }
    }
  }
}

// Enemy buff system
function hasEnemyBuff(enemy, buffId) {
  return enemy.buffs && enemy.buffs[buffId] && enemy.buffs[buffId] > 0;
}

function applyEnemyPowerUp(enemy, pu) {
  if (!enemy.buffs) enemy.buffs = {};
  let id = pu.type.id;
  game.pickupTexts.push({ text: '敌人获得 '+pu.type.icon+pu.type.label+'!', x: enemy.x, y: enemy.y - 30, timer: 60, color: '#ff4444' });
  switch(id) {
    case 'heal':
      enemy.hp = Math.min(enemy.maxHp + 2, enemy.hp + 2);
      break;
    case 'speed':
      enemy.buffs.speed = 480;
      break;
    case 'fire':
      enemy.buffs.fire = 360;
      break;
    case 'shield':
      enemy.buffs.shield = 300;
      enemy.invincible = Math.max(enemy.invincible, 300);
      break;
    case 'spread':
      enemy.buffs.spread = 420;
      break;
  }
  spawnExplosion(pu.x, pu.y, '#ff4444', 8);
}

// ===== BASE (基地) =====
const BASE_MAX_HP = 5;
class Base {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 44; this.h = 44;
    this.hp = BASE_MAX_HP;
    this.maxHp = BASE_MAX_HP;
    this.alive = true;
    this.flash = 0;
  }
  draw() {
    if (!this.alive) return;
    ctx.save();
    // Glow based on HP
    let hpRatio = this.hp / this.maxHp;
    let glowColor = hpRatio > 0.6 ? 'rgba(0,255,100,0.15)' : hpRatio > 0.3 ? 'rgba(255,200,0,0.2)' : 'rgba(255,50,50,0.25)';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 36 + Math.sin(Date.now()*0.003)*4, 0, Math.PI*2);
    ctx.fillStyle = glowColor;
    ctx.fill();
    // Base body
    let bc = this.flash > 0 ? '#fff' : (hpRatio > 0.6 ? '#2d8a4e' : hpRatio > 0.3 ? '#c8a200' : '#a03030');
    ctx.fillStyle = bc;
    ctx.fillRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
    // Border
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.strokeRect(this.x - this.w/2, this.y - this.h/2, this.w, this.h);
    // Flag icon
    ctx.font = '24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏠', this.x, this.y);
    if (this.flash > 0) this.flash--;
    ctx.restore();
  }
  takeDamage(dmg) {
    this.hp -= dmg;
    this.flash = 8;
    spawnExplosion(this.x, this.y, '#ffd700', 10);
    if (this.hp <= 0) {
      this.hp = 0;
      this.alive = false;
      spawnExplosion(this.x, this.y, '#ff4444', 40);
      game.state = 'gameover';
    }
  }
}

class Bullet {
  constructor(x, y, vx, vy) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.r = 4;
    this.alive = true;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = '#4ecdc4';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(78, 205, 196, 0.3)';
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.life = 20 + Math.random() * 15;
    this.maxLife = this.life;
    this.color = color;
    this.r = 2 + Math.random() * 4;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.life--;
  }
  draw() {
    let alpha = this.life / this.maxLife;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * alpha, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ===== POWERUP SYSTEM =====
const POWERUP_TYPES = [
  { id: 'heal',   icon: '❤️', color: '#ff4444', label: '回血',  desc: '+3 HP' },
  { id: 'speed',  icon: '⚡', color: '#ffdd00', label: '加速',  desc: '速度x1.5' },
  { id: 'fire',   icon: '🔥', color: '#ff8800', label: '火力',  desc: '双倍伤害' },
  { id: 'shield', icon: '🛡️', color: '#44aaff', label: '护盾',  desc: '无敌5秒' },
  { id: 'spread', icon: '⭐', color: '#aa44ff', label: '散弹',  desc: '三发散射' },
];

class PowerUp {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    this.r = 16;
    this.alive = true;
    this.timer = 0;
    this.lifespan = 600; // 10 seconds before disappearing
  }
  update() {
    this.timer++;
    if (this.timer > this.lifespan) this.alive = false;
  }
  draw() {
    if (!this.alive) return;
    let pulse = 1 + Math.sin(this.timer * 0.08) * 0.15;
    let alpha = this.timer > this.lifespan - 120 ? (this.lifespan - this.timer) / 120 : 1;
    
    ctx.save();
    ctx.globalAlpha = alpha;
    
    // Glow circle
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * pulse + 6, 0, Math.PI * 2);
    ctx.fillStyle = this.type.color + '33';
    ctx.fill();
    
    // Background circle
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * pulse, 0, Math.PI * 2);
    ctx.fillStyle = this.type.color + '88';
    ctx.fill();
    ctx.strokeStyle = this.type.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Icon
    ctx.font = (this.r * pulse) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(this.type.icon, this.x, this.y);
    
    // Blinking warning when about to disappear
    if (this.timer > this.lifespan - 120 && Math.floor(this.timer / 8) % 2 === 0) {
      ctx.globalAlpha = 0.3;
    }
    
    ctx.restore();
  }
}

// Active buff timers on the player
function hasBuff(buffId) {
  return game && game.buffs && game.buffs[buffId] && game.buffs[buffId] > 0;
}

function applyPowerUp(pu) {
  let p = game.player;
  let id = pu.type.id;
  
  if (!game.buffs) game.buffs = {};
  
  // Show pickup text
  game.pickupTexts.push({ text: pu.type.icon + ' ' + pu.type.desc, x: p.x, y: p.y - 30, timer: 60, color: pu.type.color });
  
  switch(id) {
    case 'heal':
      p.hp = Math.min(p.maxHp, p.hp + 3);
      break;
    case 'speed':
      game.buffs.speed = 480; // 8 seconds
      break;
    case 'fire':
      game.buffs.fire = 360; // 6 seconds
      break;
    case 'shield':
      game.buffs.shield = 300; // 5 seconds
      p.invincible = 300;
      break;
    case 'spread':
      game.buffs.spread = 420; // 7 seconds
      break;
  }
  spawnExplosion(pu.x, pu.y, pu.type.color, 12);
}

function startGame() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  
  if (animId) cancelAnimationFrame(animId);
  
  game = {
    player: new Tank(450, 460, '#4ecdc4', true),
    enemies: [],
    playerBullets: [],
    enemyBullets: [],
    particles: [],
    obstacles: [],
    powerups: [],
    buffs: {},
    pickupTexts: [],
    score: 0,
    wave: 0,
    waveTimer: 0,
    bossSpawned: false,
    boss: null,
    base: new Base(450, 565),
    state: 'playing',
    stars: []
  };
  
  for (let i = 0; i < 80; i++) {
    game.stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2,
      a: Math.random()
    });
  }
  
  spawnWave();
  gameLoop();
}

function spawnWave() {
  game.wave++;
  if (game.wave > 20) {
    game.state = 'victory';
    return;
  }
  game.waveTimer = 180;
  
  game.obstacles = generateObstacles(game.wave);
  
  // 每关都有Boss！Boss随关卡变强
  let bossHp = 20 + game.wave * 8;
  let bossSpeed = 0.6 + game.wave * 0.025;
  let bossX = 100 + Math.random() * (canvas.width - 200);
  let boss = new Enemy(bossX, 60 + Math.random() * 30, 'boss');
  boss.hp = bossHp;
  boss.maxHp = bossHp;
  boss.radius = 28;
  boss.baseSpeed = bossSpeed;
  game.enemies.push(boss);
  game.boss = boss;
  game.bossSpawned = true;
  document.getElementById('bossBar').style.display = 'block';
  
  // 小兵数量随关卡增加
  let count = 1 + Math.floor(game.wave * 0.8);
  let hp = 1 + Math.floor(game.wave / 3);
  let spd = 0.7 + game.wave * 0.04;
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = 80 + Math.random() * (canvas.width - 160);
      y = 30 + Math.random() * 80;
    } while (Math.hypot(x - game.player.x, y - game.player.y) < 150);
    
    let types = ['normal'];
    if (game.wave >= 4) types.push('fast');
    if (game.wave >= 8) types.push('heavy');
    let t = types[Math.floor(Math.random() * types.length)];
    let e = new Enemy(x, y, t);
    e.hp = hp;
    e.maxHp = hp;
    if (t === 'fast') { e.baseSpeed = spd * 1.5; e.hp = Math.max(1, hp - 1); e.maxHp = e.hp; }
    if (t === 'heavy') { e.baseSpeed = spd * 0.6; e.hp = hp * 2; e.maxHp = e.hp; }
    game.enemies.push(e);
  }
  
  // Base protection walls (brick fortress)
  let bx = game.base.x, by = game.base.y;
  game.obstacles.push(new Obstacle(bx - 22, by - 32, 'brick'));
  game.obstacles.push(new Obstacle(bx, by - 32, 'brick'));
  game.obstacles.push(new Obstacle(bx + 22, by - 32, 'brick'));
  game.obstacles.push(new Obstacle(bx - 32, by, 'brick'));
  game.obstacles.push(new Obstacle(bx + 32, by, 'brick'));
  
  document.getElementById('waveDisplay').textContent = '第' + game.wave + '关';
  game.pickupTexts.push({ text: '⚠️ 第' + game.wave + '关 BOSS出击！', x: 450, y: 280, timer: 100, color: '#ff4444' });
}

function playerShoot() {
  if (shootCooldown > 0) return;
  let p = game.player;
  let a = p.turretAngle;
  let tipX = p.x + Math.cos(a) * 30;
  let tipY = p.y + Math.sin(a) * 30;
  let speed = 8;
  let dmg = hasBuff('fire') ? 2 : 1;
  
  if (hasBuff('spread')) {
    // Triple spread shot
    for (let i = -1; i <= 1; i++) {
      let sa = a + i * 0.2;
      game.playerBullets.push(new Bullet(
        p.x + Math.cos(sa) * 30, p.y + Math.sin(sa) * 30,
        Math.cos(sa) * speed, Math.sin(sa) * speed
      ));
      game.playerBullets[game.playerBullets.length-1].dmg = dmg;
    }
  } else {
    game.playerBullets.push(new Bullet(tipX, tipY, Math.cos(a) * speed, Math.sin(a) * speed));
    game.playerBullets[game.playerBullets.length-1].dmg = dmg;
  }
  shootCooldown = hasBuff('fire') ? 6 : 8; // faster fire rate with fire buff
}

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    game.particles.push(new Particle(x, y, color));
  }
}

function updateHUD() {
  let p = game.player;
  let hearts = '';
  for (let i = 0; i < p.maxHp; i++) {
    hearts += i < p.hp ? '❤️' : '🖤';
  }
  document.getElementById('hpDisplay').textContent = hearts;
  document.getElementById('scoreDisplay').textContent = '分数: ' + game.score;
  
  // Base HP display
  if (game.base) {
    let baseStr = '';
    for (let i = 0; i < game.base.maxHp; i++) {
      baseStr += i < game.base.hp ? '🏠' : '🏚️';
    }
    document.getElementById('baseDisplay').textContent = baseStr;
  }
  
  let buffStr = '';
  if (game.boss && game.boss.alive) {
    let pct = Math.max(0, game.boss.hp / game.boss.maxHp * 100);
    document.getElementById('bossBarInner').style.width = pct + '%';
  }
  
  // Buff display
  if (game.buffs) {
    if (hasBuff('speed'))  buffStr += '⚡' + Math.ceil(game.buffs.speed/60) + 's ';
    if (hasBuff('fire'))   buffStr += '🔥' + Math.ceil(game.buffs.fire/60) + 's ';
    if (hasBuff('shield')) buffStr += '🛡️' + Math.ceil(game.buffs.shield/60) + 's ';
    if (hasBuff('spread')) buffStr += '⭐' + Math.ceil(game.buffs.spread/60) + 's ';
  }
  document.getElementById('buffDisplay').textContent = buffStr;
}

function gameLoop() {
  if (!game || game.state !== 'playing') return;
  
  const W = canvas.width, H = canvas.height;
  let p = game.player;
  
  // Player movement with obstacle collision
  let dx = 0, dy = 0;
  if (keys['w'] || keys['W'] || keys['ArrowUp']) dy = -1;
  if (keys['s'] || keys['S'] || keys['ArrowDown']) dy = 1;
  if (keys['a'] || keys['A'] || keys['ArrowLeft']) dx = -1;
  if (keys['d'] || keys['D'] || keys['ArrowRight']) dx = 1;
  
  if (dx !== 0 || dy !== 0) {
    let len = Math.sqrt(dx*dx + dy*dy);
    let spd = hasBuff('speed') ? p.speed * 1.5 : p.speed;
    let nx = p.x + (dx/len) * spd;
    let ny = p.y + (dy/len) * spd;
    
    // Try full movement
    if (!collideObstacles(nx, ny, p.w/2, p.h/2)) {
      p.x = nx;
      p.y = ny;
    } else {
      // Try horizontal only (slide along walls)
      if (!collideObstacles(nx, p.y, p.w/2, p.h/2)) {
        p.x = nx;
      }
      // Try vertical only
      else if (!collideObstacles(p.x, ny, p.w/2, p.h/2)) {
        p.y = ny;
      }
    }
  }
  p.x = Math.max(25, Math.min(W - 25, p.x));
  p.y = Math.max(25, Math.min(H - 25, p.y));
  
  // Turret control
  let aimDx = 0, aimDy = 0;
  if (keys['j'] || keys['J']) aimDx = -1;
  if (keys['l'] || keys['L']) aimDx = 1;
  if (keys['i'] || keys['I']) aimDy = -1;
  if (keys['k'] || keys['K']) aimDy = 1;
  
  if (aimDx !== 0 || aimDy !== 0) {
    p.turretAngle = Math.atan2(aimDy, aimDx);
  } else {
    p.turretAngle = Math.atan2(mouseY - p.y, mouseX - p.x);
  }
  
  // Shooting
  if (shootCooldown > 0) shootCooldown--;
  if (mouseDown || keys[' ']) playerShoot();
  
  p.update();
  
  // Update enemies
  game.enemies.forEach(e => e.update(p, W, H));
  
  // Update player bullets
  game.playerBullets.forEach(b => {
    let prevX = b.x, prevY = b.y;
    b.update();
    // Check collision with enemies
    game.enemies.forEach(e => {
      if (!e.alive || !b.alive) return;
      let hw = e.w / 2, hh = e.h / 2;
      if (b.x > e.x - hw && b.x < e.x + hw && b.y > e.y - hh && b.y < e.y + hh) {
        b.alive = false;
        e.hp -= (b.dmg || 1);
        e.flash = 5;
        spawnExplosion(b.x, b.y, '#ffaa00', 5);
        
        if (e.hp <= 0) {
          e.alive = false;
          spawnExplosion(e.x, e.y, '#ff4444', 25);
          if (e.type === 'boss') {
            game.score += 500;
            game.boss = null;
            document.getElementById('bossBar').style.display = 'none';
            // Boss drops 3 powerups!
            for (let i = 0; i < 3; i++) {
              game.powerups.push(new PowerUp(e.x + (Math.random()-0.5)*60, e.y + (Math.random()-0.5)*40));
            }
          } else {
            game.score += 100;
            // 40% chance to drop powerup
            if (Math.random() < 0.4) {
              game.powerups.push(new PowerUp(e.x, e.y));
            }
          }
        }
      }
    });
    // Check collision with obstacles (raycast prevents tunneling)
    if (b.alive) {
      let result = bulletHitObstacles(b.x, b.y, prevX, prevY, b.r, true);
      if (result === 'hit') b.alive = false;
    }
  });
  
  // Update enemy bullets
  game.enemyBullets.forEach(b => {
    let prevX = b.x, prevY = b.y;
    b.x += b.vx;
    b.y += b.vy;
    // Check collision with player
    if (p.alive && p.invincible <= 0) {
      let dist = Math.hypot(b.x - p.x, b.y - p.y);
      if (dist < 16) {
        p.hp -= b.dmg;
        p.flash = 5;
        p.invincible = 30;
        b.alive = false;
        spawnExplosion(p.x, p.y, '#4ecdc4', 8);
        
        if (p.hp <= 0) {
          p.alive = false;
          spawnExplosion(p.x, p.y, '#4ecdc4', 30);
          game.state = 'gameover';
        }
      }
    }
    // Check collision with obstacles (enemy bullets also blocked by walls)
    if (b.alive) {
      let result = bulletHitObstacles(b.x, b.y, prevX, prevY, b.r, false);
      if (result === 'hit') b.alive = false;
    }
  });
  
  // Update particles
  game.particles.forEach(pt => pt.update());
  
  // Update powerups
  game.powerups.forEach(pu => pu.update());
  
  // Check player pickup powerups
  game.powerups.forEach(pu => {
    if (!pu.alive) return;
    let dist = Math.hypot(pu.x - p.x, pu.y - p.y);
    if (dist < 28) {
      pu.alive = false;
      applyPowerUp(pu);
    }
  });
  
  // Check enemy pickup powerups (enemies can steal them!)
  game.powerups.forEach(pu => {
    if (!pu.alive) return;
    game.enemies.forEach(e => {
      if (!e.alive) return;
      let dist = Math.hypot(pu.x - e.x, pu.y - e.y);
      if (dist < 30) {
        pu.alive = false;
        applyEnemyPowerUp(e, pu);
      }
    });
  });
  
  // Update enemy buff timers
  game.enemies.forEach(e => {
    if (!e.alive || !e.buffs) return;
    for (let key in e.buffs) {
      if (e.buffs[key] > 0) e.buffs[key]--;
      if (e.buffs[key] <= 0) {
        if (key === 'shield') e.invincible = Math.max(0, e.invincible - 1);
      }
    }
  });
  
  // Enemy bullets hit base
  if (game.base && game.base.alive) {
    game.enemyBullets.forEach(b => {
      if (!b.alive) return;
      let dx = b.x - game.base.x;
      let dy = b.y - game.base.y;
      if (Math.abs(dx) < game.base.w/2 && Math.abs(dy) < game.base.h/2) {
        b.alive = false;
        game.base.takeDamage(b.dmg || 1);
      }
    });
    // Enemies physically reaching base = damage
    game.enemies.forEach(e => {
      if (!e.alive) return;
      let dist = Math.hypot(e.x - game.base.x, e.y - game.base.y);
      if (dist < 30) {
        game.base.takeDamage(1);
        e.alive = false;
        spawnExplosion(e.x, e.y, '#ff4444', 15);
        game.score += 50;
      }
    });
  }
  
  // Update buff timers
  if (game.buffs) {
    for (let key in game.buffs) {
      if (game.buffs[key] > 0) game.buffs[key]--;
    }
  }
  
  // Keep shield invincibility in sync
  if (hasBuff('shield') && p.invincible < game.buffs.shield) {
    p.invincible = game.buffs.shield;
  }
  
  // Update pickup texts
  game.pickupTexts.forEach(t => { t.timer--; t.y -= 0.8; });
  game.pickupTexts = game.pickupTexts.filter(t => t.timer > 0);
  
  // Clean up
  game.playerBullets = game.playerBullets.filter(b => b.alive && b.x > -10 && b.x < W+10 && b.y > -10 && b.y < H+10);
  game.enemyBullets = game.enemyBullets.filter(b => b.alive && b.x > -10 && b.x < W+10 && b.y > -10 && b.y < H+10);
  game.particles = game.particles.filter(pt => pt.life > 0);
  game.powerups = game.powerups.filter(pu => pu.alive);
  
  // Check wave clear
  let aliveEnemies = game.enemies.filter(e => e.alive);
  if (aliveEnemies.length === 0 && game.state === 'playing') {
    if (game.wave >= 20) {
      game.state = 'victory';
    } else {
      game.waveTimer++;
      if (game.waveTimer > 60) {
        game.waveTimer = 0;
        // Reset boss state for next wave
        document.getElementById('bossBar').style.display = 'none';
        game.bossSpawned = false;
        game.boss = null;
        spawnWave();
      }
    }
  }
  
  // ===== DRAW =====
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, W, H);
  
  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 50) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 50) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  
  // Stars
  game.stars.forEach(s => {
    ctx.globalAlpha = 0.3 + s.a * 0.7;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Draw obstacles (behind tanks)
  game.obstacles.forEach(ob => ob.draw());
  
  // Draw powerups
  game.powerups.forEach(pu => pu.draw());
  
  // Draw bullets
  game.playerBullets.forEach(b => b.draw());
  
  // Draw enemy bullets
  game.enemyBullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 68, 68, 0.3)';
    ctx.fill();
  });
  
  // Draw tanks
  game.player.draw();
  game.enemies.forEach(e => {
    e.draw();
    // Enemy buff visual indicator
    if (e.alive && e.buffs) {
      let buffColors = [];
      if (e.buffs.speed > 0) buffColors.push('#ffff00');
      if (e.buffs.fire > 0) buffColors.push('#ff6600');
      if (e.buffs.shield > 0) buffColors.push('#44aaff');
      if (e.buffs.spread > 0) buffColors.push('#ff00ff');
      if (buffColors.length > 0) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius + 6, 0, Math.PI * 2);
        ctx.strokeStyle = buffColors[0];
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.008) * 0.3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  });
  
  // Draw base
  if (game.base && game.base.alive) game.base.draw();
  
  // Draw shield aura on player
  if (hasBuff('shield')) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 28, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(68, 170, 255, ' + (0.4 + Math.sin(Date.now() * 0.01) * 0.2) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  
  // Draw speed trail
  if (hasBuff('speed')) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 24, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 221, 0, 0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  
  // Draw pickup texts
  game.pickupTexts.forEach(t => {
    ctx.globalAlpha = t.timer / 60;
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });
  
  // Draw particles
  game.particles.forEach(pt => pt.draw());
  
  // Wave clear message
  if (game.state === 'playing' && game.enemies.filter(e => e.alive).length === 0 && !game.bossSpawned) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('第' + game.wave + '关通过！准备下一关...', W/2, H/2);
  }
  
  updateHUD();
  
  if (game.state === 'gameover') {
    document.getElementById('finalScore').textContent = '最终分数: ' + game.score + ' (打到第' + game.wave + '关)';
    document.getElementById('gameOverScreen').style.display = 'flex';
    return;
  }
  if (game.state === 'victory' || game.state === 'win') {
    document.getElementById('winScore').textContent = '最终分数: ' + game.score + ' 🏆通关20关！';
    document.getElementById('winScreen').style.display = 'flex';
    return;
  }
  
  animId = requestAnimationFrame(gameLoop);
}
</script>

</body>
</html>
